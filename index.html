<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // Disable restoration before the lazy journey changes the document height.
      if (location.pathname === '/' && !location.hash) {
        history.scrollRestoration = 'manual';
        // Reset before rendering, never after visitors have already begun scrolling.
        window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
        // Fetch the opening artwork before the React and 3D bundles finish loading.
        const portrait = matchMedia('(orientation:portrait)').matches;
        const variant = !portrait && innerWidth <= 1000 ? 'landscape'
          : portrait && innerWidth <= 350 && innerHeight >= 780 ? 'small'
          : portrait && innerWidth <= 900 ? (innerWidth >= 600 ? 'tablet' : 'mobile')
          : innerWidth / innerHeight >= 1.7 ? 'wide' : 'desktop';
        const file = ['mobile', 'small', 'landscape'].includes(variant) ? variant + '-large-v2' : variant;
        const preload = document.createElement('link');
        preload.rel = 'preload'; preload.as = 'image'; preload.fetchPriority = 'high';
        preload.href = '/assets/scenery/showcase-' + file + '.webp';
        document.head.appendChild(preload);
      }
    </script>
    <meta name="theme-color" content="#dceef0" />
    <meta name="description" content="Explore Toy-On product designs and a foil balloon manufacturing overview. Contact Toyon Industry Pvt Ltd in Odhav, Ahmedabad for business enquiries." />
    <link rel="canonical" href="https://www.toyonindustry.com/" />
    <meta property="og:title" content="Products &amp; Manufacturing in Ahmedabad | Toy-On" />
    <meta property="og:description" content="Explore Toy-On product designs and a foil balloon manufacturing overview. Contact Toyon Industry Pvt Ltd in Odhav, Ahmedabad for business enquiries." />
    <meta property="og:url" content="https://www.toyonindustry.com/" />
    <meta property="og:type" content="website" />
    <link rel="icon" href="data:," />
    <title>Products & Manufacturing in Ahmedabad | Toy-On</title>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
